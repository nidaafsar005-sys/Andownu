<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Video Downloader – Download Videos from YouTube, Facebook, Instagram & More | Andown</title>
    <meta name="title" content="Video Downloader – Download Videos from YouTube, Facebook, Instagram & More | Andown" />
    <meta name="description" content="Andown is a fast and simple video downloader for supported public URLs from popular social and video platforms. Safe, fast, and high quality." />
    <link rel="canonical" href="https://www.andown.in/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.andown.in/" />
    <meta property="og:title" content="Video Downloader – Download Videos from YouTube, Facebook, Instagram & More | Andown" />
    <meta property="og:description" content="Andown is a fast and simple video downloader for supported public URLs from popular social and video platforms." />
    <meta property="og:image" content="https://www.andown.in/og-image.jpg" />

    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.andown.in/" />
    <meta property="twitter:title" content="Video Downloader – Andown" />
    <meta property="twitter:description" content="Fast, simple and convenient media downloading for supported public URLs." />
    <meta property="twitter:image" content="https://www.andown.in/og-image.jpg" />

    <!-- Google Search Console & Webmaster verification placeholder -->
    <!-- <meta name="google-site-verification" content="YOUR_GOOGLE_VERIFICATION_TOKEN" /> -->

    <!-- Structured Data (JSON-LD) for WebApplication and Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.andown.in/#organization",
          "name": "Andown",
          "url": "https://www.andown.in/",
          "logo": "https://www.andown.in/logo.png"
        },
        {
          "@type": "WebSite",
          "@id": "https://www.andown.in/#website",
          "url": "https://www.andown.in/",
          "name": "Andown",
          "publisher": { "@id": "https://www.andown.in/#organization" }
        },
        {
          "@type": "WebApplication",
          "@id": "https://www.andown.in/#webapp",
          "name": "Andown Universal Video Downloader",
          "url": "https://www.andown.in/",
          "applicationCategory": "MultimediaApplication",
          "operatingSystem": "All",
          "browserRequirements": "Requires JavaScript. Requires HTML5."
        }
      ]
    }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
